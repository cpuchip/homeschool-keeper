name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: backend/frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('backend/frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install Go dependencies
      run: go mod download
      working-directory: backend

    - name: Install frontend dependencies
      run: |
        cd backend/frontend
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Lint frontend
      run: |
        cd backend/frontend
        npm run lint --if-present

    - name: Build frontend
      run: |
        cd backend/frontend
        npm run build

    - name: Run Go tests
      run: |
        cd backend
        # Run all tests including integration tests with testcontainers
        # Docker is pre-installed on ubuntu-latest runners
        go test -v -race -coverprofile=coverage.out ./...

    - name: Build Go backend
      run: |
        cd backend
        go build -v -o homeschool-keeper .

    - name: Test API endpoints
      env:
        SESSION_SECRET: test-session-secret-for-ci-min32chars
        ENCRYPTION_MASTER_KEY: test-encryption-key-for-ci-min32c
        JWT_SECRET: test-jwt-secret-for-ci-min32chars
        DEV_MODE: "true"
      run: |
        cd backend
        chmod +x ./homeschool-keeper
        
        # Start server and capture logs
        ./homeschool-keeper > server.log 2>&1 &
        SERVER_PID=$!
        echo "Started server with PID: $SERVER_PID"
        
        # Wait for server to be ready with retry loop
        MAX_ATTEMPTS=30
        ATTEMPT=0
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))
          echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking if server is ready..."
          if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "Server is ready!"
            break
          fi
          sleep 1
        done
        
        # Show server logs for debugging
        echo "=== Server logs ==="
        cat server.log || true
        echo "==================="
        
        # Check if server process is still running
        if ! ps -p $SERVER_PID > /dev/null 2>&1; then
          echo "ERROR: Server process died!"
          exit 1
        fi
        
        # Final health check with verbose output
        echo "Running health check..."
        curl -v http://localhost:8080/api/health
        
        # Stop the server
        kill $SERVER_PID 2>/dev/null || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    name: Build and Push Docker Image
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Deploy notification
      run: |
        echo "🚀 Ready for deployment to dokploy"
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo ""
        echo "Dokploy will auto-deploy from the registry."
