include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Allow print in test files - they're not compiled into release
    avoid_print: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    # Disabled: print is allowed in test files, and production code uses logger
    # - avoid_print
    - require_trailing_commas
    - prefer_single_quotes
