# Dokploy Deployment Configuration
# Homeschool Keeper

app_name: "homeschool-keeper"
domain: "homeschoolkeeper.app"  # Update with actual domain
port: 8080

# Docker Configuration
docker:
  image: "ghcr.io/cpuchip/homeschool-keeper:latest"
  platform: "linux/amd64"
  restart_policy: "unless-stopped"

# Environment Variables (set in dokploy dashboard, not here)
environment:
  - PORT=8080
  # MONGODB_URI - set in dashboard (secret)
  # JWT_SECRET - set in dashboard (secret)

# Health Check
health_check:
  endpoint: "/api/health"
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# Resource Limits
resources:
  memory: "512Mi"
  cpu: "0.5"

# SSL/TLS
ssl:
  enabled: true
  auto_cert: true  # Let's Encrypt

# Networking
networking:
  expose_port: 8080
  internal_port: 8080

# Deployment Strategy
deployment:
  strategy: "rolling_update"
  max_unavailable: 0
  max_surge: 1

# Monitoring
monitoring:
  enabled: true
  endpoints:
    - path: "/api/health"
      expected_status: 200

# Logs
logging:
  level: "info"
  retention_days: 14
